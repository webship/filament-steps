name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    # The whole suite on the panel's official demo app (two panels, a shop, a blog, an HR suite), and
    # the features of a new panel on a new app with the panel installed the documented way and one
    # generated resource.
    name: filament-steps test suite (${{ matrix.app }} app)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: demo
            panel-path: ''
            features: ''
          - app: panel
            panel-path: /admin
            features: tests/panel/**/*.feature
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE_DIR: ${{ github.workspace }}/../filament-app
      APP: ${{ matrix.app }}
      PANEL_PATH: ${{ matrix.panel-path }}
      FEATURES: ${{ matrix.features }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The steps this pack builds on (the panel's user menu, its toasts, its login form) are in the
      # 2.0.x branch of the Laravel pack, released as 2.0.1: until that release is on npm, the job
      # takes them from the branch.
      - name: Take the Laravel pack's steps from its 2.0.x branch until 2.0.1 is on npm
        run: |
          if node -e "const v = require('@webship-js/laravel-steps/package.json').version.split('.').map(Number); process.exit(v[0] > 2 || v[1] > 0 || v[2] >= 1 ? 0 : 1)"; then
            echo "The Laravel pack on npm is new enough."
          else
            git clone --quiet --depth 1 --branch 2.0.x https://github.com/webship/laravel-steps.git "$RUNNER_TEMP/laravel-steps"
            cp -r "$RUNNER_TEMP/laravel-steps/tests/step-definitions/." node_modules/@webship-js/laravel-steps/tests/step-definitions/
            echo "The Laravel pack's steps at $(git -C "$RUNNER_TEMP/laravel-steps" log -1 --format='%h %s')."
          fi

      - name: Check the JSDoc examples and feature steps against the step regexes (and that no phrase names a platform)
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build the test app with DDEV
        run: .github/scripts/build-ddev-site.sh

      - name: Check the app is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Built: $LAUNCH_URL, default: $DEFAULT_URL"
          test "${LAUNCH_URL%/}" = "$DEFAULT_URL"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the app as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        if: matrix.app == 'demo'
        run: npm run test:must-fail

      - name: Show the log of the app
        if: failure()
        run: (cd "$SITE_DIR" && ddev exec 'tail -n 200 storage/logs/laravel.log' || true)

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.app }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.app }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
